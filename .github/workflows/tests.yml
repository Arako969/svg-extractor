name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  geometry-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tkinter installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk

      - name: Abhaengigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Python-Syntax pruefen
        run: python -m py_compile coloring_region_extractor_gui.py

      - name: Geometrietests ausfuehren
        run: python -m unittest discover -s tests -v
